[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idea-gauntlet-backend"
version = "0.1.0"
description = "FastAPI backend for Idea Gauntlet"
requires-python = ">=3.11"
# No langgraph/chromadb here — those were the arena chat orchestration, which
# this app does not use. Gauntlet talks to LLMs through litellm directly.
dependencies = [
  "fastapi>=0.135.0",
  "google-auth>=2.49.0",
  "httpx>=0.28.0",
  "langchain-core>=1.2.0",
  "langchain-litellm>=0.0.1",
  "litellm>=1.82.0",
  "pydantic>=2.12.0",
  "python-jose[cryptography]>=3.5.0",
  "pyyaml>=6.0.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "uvicorn[standard]>=0.42.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.11.0",
  "mypy>=1.13.0",
  "mdformat>=0.7.0",
  "mdformat-frontmatter>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["config.toml"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
# Third-party libs without bundled stubs (litellm, langchain_litellm, etc.)
# shouldn't fail the check.
ignore_missing_imports = true
# Pragmatic baseline for an existing codebase: check annotated code, don't
# force annotations everywhere. Tighten over time.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
