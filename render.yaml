# Render blueprint for a SELF-HOST (BYO-key) Idea Gauntlet deployment.

databases:
  - name: idea-gauntlet-db
    databaseName: idea_gauntlet
    user: idea_gauntlet
    plan: basic-256mb

services:
  - type: web
    name: idea-gauntlet-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: idea-gauntlet-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://your-frontend-domain
      # This blueprint locks the LLM config to these env vars (see
      # LOCK_LLM_SETTINGS below) — fill in a provider key and the model to use.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        sync: false
      # Hides the API key / model fields in the in-app Settings modal, since
      # they're fully configured above. Only BGM music remains user-editable.
      - key: LOCK_LLM_SETTINGS
        value: "true"

  - type: web
    name: idea-gauntlet-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://your-api-domain
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
